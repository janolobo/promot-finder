<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMOT — mapa firm</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body{height:100%;margin:0;font:14px system-ui;color:#153c47;display:flex;flex-direction:column}#map{flex:1;min-height:0;background:#e8eef0}#bar{flex:none;background:#fff;padding:12px 16px;border-bottom:1px solid #dae5e8}body.embedded #bar{display:none}#status{font-weight:600}#setup{margin-top:8px}input,button{font:inherit;padding:7px;border:1px solid #bbcbd0;border-radius:6px}button{cursor:pointer;background:#fff}a{color:#117c91}.popup{max-width:320px;line-height:1.6}.popup b{font-size:15px}.popup small{display:block}.popup a{margin-right:10px}#error{color:#9e4325;font-size:12px}.legend{font-size:12px;margin-top:4px}progress{height:7px;width:100%;accent-color:#09877f}#fit{margin-left:8px}</style></head>
<body><div id="map"></div><div id="bar"><span id="status">Mapa oczekuje na wyniki</span><button id="fit">Pokaż wszystkie</button><progress id="progress" max="1" value="0"></progress><div class="legend">● Czerwony: konkurencja · Zielony: dopasowanie słów &nbsp; ● Niebieski: analiza/oczekuje &nbsp; ● Szary: do sprawdzenia</div><div id="error"></div><div id="setup" hidden><input id="key" type="password" placeholder="Klucz Google Maps JavaScript API"><button id="google">Włącz Google Maps</button><button id="osm">Mapa OSM</button><small> Bez klucza działa mapa OSM. Klucz Google nie jest zapisany w pliku. Mapa wymaga internetu.</small></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const exported=/*SNAPSHOT*/null;
let state=exported||{records:[],progress:{phase:'Gotowy',done:0,total:0}},map,engine='',markers=[],googleKey='',autoFit=true,previousCount=0,markerSignature='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const http=u=>/^https?:\/\//i.test(u||'');
function popup(r){let links=http(r.website)?`<a target="_blank" rel="noopener" href="${esc(r.website)}">Strona firmy ↗</a>`:'';if(http(r.source))links+=`<a target="_blank" rel="noopener" href="${esc(r.source)}">Źródło ↗</a>`;let destination=r.lat+','+r.lon;links+=`<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}">Trasa w Google Maps ↗</a>`;let contacts=(r.contacts||[]).slice(0,8).map(c=>`<small>${esc(c.person||'Kontakt strony')} ${esc(c.email)} ${esc(c.phone)}</small>`).join('');return `<div class="popup"><b>${esc(r.name)}</b><br>${esc(r.address)}<small>${esc((r.groups||[]).join(' · '))} · ${esc(r.province||'')}</small><small>${esc(r.category)}</small><small>${esc(r.status)}</small>${contacts}${links}<small>${esc(r.geo_precision||'Współrzędne ze źródła')}</small><small>${esc(r.geo_label||'')}</small><small>Współrzędne: ${esc(r.lat)}, ${esc(r.lon)}</small></div>`}
function valid(r){return typeof r.lat==='number'&&typeof r.lon==='number'&&Math.abs(r.lat)<=90&&Math.abs(r.lon)<=180}
function color(r){if((r.groups||[]).includes('Konkurencja'))return '#c23b46';return String(r.status||'').startsWith('Dopasowanie')?'#09877f':(/Analiza|Oczekuje/.test(r.status||'')?'#297db3':'#77878c')}
function groupColor(group){let rank={'#c23b46':0,'#09877f':1,'#297db3':2,'#77878c':3};return group.map(color).sort((a,b)=>rank[a]-rank[b])[0]}
function initOSM(){
if(location.protocol==='file:'){
document.getElementById('status').textContent='Otwórz mapę przez program';
document.getElementById('error').textContent='Plik otwarto bezpośrednio z dysku. W tym trybie nie pobieramy kafelków OSM, ponieważ brakuje nagłówka Referer wymaganego przez usługę. Uruchom Uruchom.command / Uruchom.bat, aby zobaczyć panel, albo Otworz_mape.command / Otworz_mape.bat, aby zobaczyć ostatnio zapisane wyniki. Dowolny wyeksportowany HTML możesz też udostępnić przez lokalny serwer HTTP zgodnie z instrukcją.';
return;
}
if(engine==='google'){document.getElementById('map').innerHTML='';map=null}
if(engine==='osm'&&map)map.remove();engine='osm';markers=[];markerSignature='';previousCount=0;
if(!window.L){document.getElementById('error').textContent='Nie udało się pobrać biblioteki mapy. Sprawdź połączenie internetowe.';return}
map=L.map('map').setView([51,16],5);
let failures=0;
const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,updateWhenIdle:true,keepBuffer:1,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'});
tiles.on('tileerror',()=>{if(++failures>=3){tiles.remove();document.getElementById('error').textContent='Nie udało się pobrać podkładu OSM. Pobieranie zostało zatrzymane; punkty i dane pozostają dostępne. Sprawdź połączenie i nagłówek Referer w przeglądarce. Możesz użyć mapy Google z własnym kluczem API.';}});
tiles.addTo(map);map.on('dragstart',()=>autoFit=false);render()}
window.gm_authFailure=()=>{document.getElementById('error').textContent='Google odrzucił klucz. Sprawdź billing, Maps JavaScript API i ograniczenie adresów. Przywrócono OSM.';initOSM()};
window.initGoogle=()=>{if(engine==='osm'&&map)map.remove();document.getElementById('map').innerHTML='';engine='google';markers=[];map=new google.maps.Map(document.getElementById('map'),{center:{lat:51,lng:16},zoom:5,mapTypeControl:true,fullscreenControl:true,streetViewControl:true});map.addListener('dragstart',()=>autoFit=false);render()};
function loadGoogle(key){if(!key)return;googleKey=key;document.getElementById('error').textContent='';if(window.google?.maps){initGoogle();return}let old=document.getElementById('google-script');if(old)old.remove();let s=document.createElement('script');s.id='google-script';s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&loading=async&callback=initGoogle';s.async=true;s.onerror=()=>{document.getElementById('error').textContent='Nie udało się wczytać Google Maps. Mapa OSM pozostaje dostępna.'};document.head.appendChild(s)}
function fit(){let rows=state.records.filter(valid);if(!rows.length||!map)return;if(engine==='osm')map.fitBounds(rows.map(r=>[r.lat,r.lon]),{padding:[40,80],maxZoom:12});else if(engine==='google'){let b=new google.maps.LatLngBounds();rows.forEach(r=>b.extend({lat:r.lat,lng:r.lon}));map.fitBounds(b,70);if(rows.length===1)google.maps.event.addListenerOnce(map,'idle',()=>map.setZoom(12))}}
function render(){let rows=state.records.filter(valid),p=state.progress;document.getElementById('status').textContent=`${p.phase||'Gotowy'} · ${p.done||0}/${p.total||0} przeanalizowanych · ${p.geo_done||0}/${p.geo_total||0} lokalizacji · ${rows.length} na mapie · ${state.records.length-rows.length} bez współrzędnych`;let progress=document.getElementById('progress');progress.max=p.total||p.queries_total||1;progress.value=p.total?p.done:(p.queries_done||0);if(!map)return;let signature=JSON.stringify(rows);if(signature===markerSignature)return;markerSignature=signature;markers.forEach(m=>engine==='osm'?m.remove():m.setMap(null));markers=[];let groups=new Map();for(let r of rows){let k=r.lat+','+r.lon;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}for(let group of groups.values()){let r=group[0],fill=groupColor(group),scale=group.some(x=>x.status==='Analiza')?10:7,content=group.map(popup).join('<hr>');if(engine==='osm'){markers.push(L.circleMarker([r.lat,r.lon],{radius:scale,color:'#fff',weight:2,fillColor:fill,fillOpacity:.95}).addTo(map).bindPopup(content,{maxHeight:350}))}else{let m=new google.maps.Marker({position:{lat:r.lat,lng:r.lon},map,title:group.length>1?group.length+' firm: '+r.geo_label:r.name,icon:{path:google.maps.SymbolPath.CIRCLE,scale:scale,fillColor:fill,fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});m.addListener('click',()=>new google.maps.InfoWindow({content:content}).open({map,anchor:m}));markers.push(m)}}if(autoFit&&rows.length!==previousCount)fit();previousCount=rows.length}
document.getElementById('fit').onclick=()=>{autoFit=true;fit()};document.getElementById('google').onclick=()=>loadGoogle(document.getElementById('key').value);document.getElementById('osm').onclick=initOSM;
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;if(e.data.type==='state'){state=e.data.state;render()}if(e.data.type==='google')loadGoogle(e.data.key);if(e.data.type==='osm')initOSM();if(e.data.type==='fit'){autoFit=true;fit()}});
if(!exported&&window.parent!==window)document.body.classList.add('embedded');
document.getElementById('setup').hidden=!exported;initOSM();if(!exported&&location.protocol!=='file:')parent.postMessage({type:'map-ready'},location.origin);
</script></body></html>
